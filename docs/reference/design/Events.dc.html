<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Events</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#C8102E}
.solid{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#FFFFFF;background:#111111;border:0;height:48px;padding:0 26px;cursor:pointer}
.solid:hover{background:#C8102E}
.year{width:100%;display:grid;grid-template-columns:200px minmax(0,1fr) auto 40px;align-items:center;gap:24px;background:transparent;border:0;border-top:3px solid #111111;padding:20px 0;cursor:pointer;text-align:left;color:#111111;font-family:'Inter',sans-serif}
.year:hover .yr{color:#C8102E}
.ev{display:grid;grid-template-columns:200px minmax(0,1.3fr) minmax(0,1.4fr) 140px 40px;align-items:center;gap:24px;min-height:84px;border-top:1px solid #E6E3DC;text-decoration:none;color:#111111}
.ev:hover{background:#F5F3EE;color:#111111}
.ev:hover .go{opacity:1}
.go{opacity:0.25}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #111111; font-family: 'Inter', sans-serif">

<header style="border-bottom: 1px solid #E6E3DC">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 36px; flex-wrap: wrap">
<a href="#" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
<g fill="none" stroke="#111111" stroke-width="1.4">
<rect x="1" y="1" width="5" height="5" fill="#C8102E"></rect><rect x="7.5" y="1" width="5" height="5"></rect><rect x="14" y="1" width="5" height="5"></rect><rect x="20.5" y="1" width="5" height="5"></rect>
<rect x="1" y="7.5" width="5" height="5"></rect><rect x="7.5" y="7.5" width="5" height="5" fill="#C8102E"></rect><rect x="14" y="7.5" width="5" height="5"></rect><rect x="20.5" y="7.5" width="5" height="5"></rect>
<rect x="1" y="14" width="5" height="5"></rect><rect x="7.5" y="14" width="5" height="5"></rect><rect x="14" y="14" width="5" height="5"></rect><rect x="20.5" y="14" width="5" height="5"></rect>
<rect x="1" y="20.5" width="5" height="5"></rect><rect x="7.5" y="20.5" width="5" height="5"></rect><rect x="14" y="20.5" width="5" height="5" fill="#1554B8"></rect><rect x="20.5" y="20.5" width="5" height="5"></rect>
</g>
</svg>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.04em; color: #111111">BOXING CLEVER</span>
</a>
<nav style="display: flex; align-items: center; gap: 24px; font-size: 15px">
<a href="#" aria-current="page" style="color: #111111; font-weight: 600; text-decoration: none; border-bottom: 2px solid #111111; padding: 20px 0 19px">Events</a>
<a href="Fighters.dc.html" style="color: #6A6760; text-decoration: none">Fighters</a>
</nav>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 56px 32px 96px; display: flex; flex-direction: column; gap: 48px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 112px; line-height: 0.84; text-transform: uppercase">Events</h1>
<p style="margin: 0; font-size: 15px; color: #6A6760">[N] nights watched since Nov 2021</p>
</div>
<button class="solid" type="button">New event</button>
</div>

<div style="border-bottom: 3px solid #111111">
<sc-for list="{{years}}" as="y" hint-placeholder-count="6">
<section>
<h2 style="margin: 0">
<button class="year" type="button" aria-expanded="{{y.expanded}}" onClick="{{y.toggle}}">
<span class="yr" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 0.9; font-variant-numeric: tabular-nums">{{y.year}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px; align-content: center" aria-hidden="true">
<sc-for list="{{y.ticks}}" as="t" hint-placeholder-count="20">
<span style="{{t.style}}"></span>
</sc-for>
</span>
<span style="font-size: 15px; color: #6A6760; white-space: nowrap">{{y.count}} events</span>
<span style="{{y.chevStyle}}" aria-hidden="true">
<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#111111" stroke-width="2.4"><path d="M5 8l6 6 6-6"></path></svg>
</span>
</button>
</h2>
<sc-if value="{{y.open}}" hint-placeholder-val="{{false}}">
<div style="padding-bottom: 24px">
<sc-for list="{{y.events}}" as="e" hint-placeholder-count="6">
<a class="ev" href="{{e.href}}">
<span style="display: flex; align-items: baseline; gap: 12px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 44px; line-height: 1; width: 56px; font-variant-numeric: tabular-nums">{{e.day}}</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.12em; color: #6A6760">{{e.month}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; line-height: 1">{{e.city}}</span>
<span style="font-size: 14px; color: #6A6760">{{e.venue}}</span>
</span>
<span style="font-size: 16px; min-width: 0">{{e.headline}}</span>
<span style="display: flex; flex-direction: column; gap: 4px; font-size: 14px">
<span>{{e.bouts}} bouts</span>
<span style="{{e.statusStyle}}">{{e.status}}</span>
</span>
<span class="go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#111111" stroke-width="2.4"><path d="M8 5l6 6-6 6"></path></svg></span>
</a>
</sc-for>
</div>
</sc-if>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: { '2026': true } };
  }
  renderVals() {
    var self = this;
    var ev2026 = [
      ['14', 'NOV', 'Riyadh', 'Kingdom Arena', 'Teófilo Arce vs Daniel Okafor', 11, 2],
      ['1', 'NOV', 'London', 'The O2', 'Marek Vasquez vs Kofi Mensah-Lund', 8, 0],
      ['18', 'OCT', 'Las Vegas', 'T-Mobile Arena', 'Sam Whitlock vs Luis Ortega', 9, 0],
      ['27', 'SEP', 'Tokyo', 'Ariake Arena', '[MAIN EVENT]', 7, 0],
      ['13', 'SEP', 'Manchester', 'AO Arena', '[MAIN EVENT]', 10, 0],
      ['30', 'AUG', 'New York', 'Madison Square Garden', '[MAIN EVENT]', 6, 0],
      ['2', 'MAY', 'Osaka', 'Edion Arena', 'Teófilo Arce vs Hiro Tanabe', 9, 0]
    ];
    var years = [['2026', ev2026.length], ['2025', 48], ['2024', 52], ['2023', 47], ['2022', 44], ['2021', 7]];
    return {
      years: years.map(function (y) {
        var open = !!self.state.open[y[0]];
        var ticks = [];
        for (var i = 0; i < y[1]; i++) ticks.push({ style: 'width: 9px; height: 9px; box-sizing: border-box; border: 1.5px solid #111111; background: ' + (open ? '#111111' : '#FFFFFF') });
        return {
          year: y[0], count: y[1], open: open, expanded: open ? 'true' : 'false', ticks: ticks,
          chevStyle: 'display: flex; justify-content: center; transform: rotate(' + (open ? '180' : '0') + 'deg)',
          toggle: function () {
            var next = Object.assign({}, self.state.open);
            next[y[0]] = !open;
            self.setState({ open: next });
          },
          events: (y[0] === '2026' ? ev2026 : [
            ['21', 'DEC', '[LOCATION]', '[VENUE]', '[MAIN EVENT]', 8, 0],
            ['7', 'DEC', '[LOCATION]', '[VENUE]', '[MAIN EVENT]', 10, 0],
            ['23', 'NOV', '[LOCATION]', '[VENUE]', '[MAIN EVENT]', 6, 0]
          ]).map(function (e) {
            var pending = e[6] > 0;
            return {
              day: e[0], month: e[1], city: e[2], venue: e[3], headline: e[4], bouts: e[5],
              href: e[2] === 'Riyadh' ? 'Event.dc.html' : '#',
              status: pending ? e[6] + ' not final' : 'all scored',
              statusStyle: pending ? 'color: #111111; font-weight: 600' : 'color: #6A6760'
            };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
