<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fighters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#C8102E}
.solid{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#FFFFFF;background:#111111;border:0;height:48px;padding:0 26px;cursor:pointer}
.solid:hover{background:#C8102E}
.quiet{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:#6A6760;background:transparent;border:0;min-height:44px;padding:0 6px;cursor:pointer}
.quiet:hover{color:#111111;text-decoration:underline}
.letter{display:grid;grid-template-columns:140px minmax(0,1fr);gap:0 32px;border-top:3px solid #111111;padding:20px 0 28px}
.lbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:transparent;border:0;padding:0;cursor:pointer;color:#111111;text-align:left}
.lbtn:hover .big{color:#C8102E}
.big{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:88px;line-height:0.8}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
.f{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;min-height:60px;border-bottom:1px solid #E6E3DC}
.f a{text-decoration:none;display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.f a:hover .ln{color:#C8102E}
.ln{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase;color:#111111;line-height:1}
.rail{display:flex;flex-wrap:wrap;gap:2px}
.rail a,.rail span{display:inline-flex;align-items:center;justify-content:center;width:36px;height:44px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;text-decoration:none}
.find{width:100%;box-sizing:border-box;height:52px;border:0;border-bottom:2px solid #111111;font-family:'Inter',sans-serif;font-size:18px;padding:0 4px;background:transparent;color:#111111;outline:none}
.find:focus{border-bottom-color:#C8102E}
.find::placeholder{color:#8A8780}
</style>
</helmet>
<div style="min-height: 100vh; background: #FFFFFF; color: #111111; font-family: 'Inter', sans-serif">

<header style="border-bottom: 1px solid #E6E3DC">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 36px; flex-wrap: wrap">
<a href="Events.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
<g fill="none" stroke="#111111" stroke-width="1.4">
<rect x="1" y="1" width="5" height="5" fill="#C8102E"></rect><rect x="7.5" y="1" width="5" height="5"></rect><rect x="14" y="1" width="5" height="5"></rect><rect x="20.5" y="1" width="5" height="5"></rect>
<rect x="1" y="7.5" width="5" height="5"></rect><rect x="7.5" y="7.5" width="5" height="5" fill="#C8102E"></rect><rect x="14" y="7.5" width="5" height="5"></rect><rect x="20.5" y="7.5" width="5" height="5"></rect>
<rect x="1" y="14" width="5" height="5"></rect><rect x="7.5" y="14" width="5" height="5"></rect><rect x="14" y="14" width="5" height="5"></rect><rect x="20.5" y="14" width="5" height="5"></rect>
<rect x="1" y="20.5" width="5" height="5"></rect><rect x="7.5" y="20.5" width="5" height="5"></rect><rect x="14" y="20.5" width="5" height="5" fill="#1554B8"></rect><rect x="20.5" y="20.5" width="5" height="5"></rect>
</g>
</svg>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.04em; color: #111111">BOXING CLEVER</span>
</a>
<nav style="display: flex; align-items: center; gap: 24px; font-size: 15px">
<a href="Events.dc.html" style="color: #6A6760; text-decoration: none">Events</a>
<a href="#" aria-current="page" style="color: #111111; font-weight: 600; text-decoration: none; border-bottom: 2px solid #111111; padding: 20px 0 19px">Fighters</a>
</nav>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 56px 32px 96px; display: flex; flex-direction: column; gap: 40px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 112px; line-height: 0.84; text-transform: uppercase">Fighters</h1>
<p style="margin: 0; font-size: 15px; color: #6A6760">[N] fighters, filed by last name</p>
</div>
<button class="solid" type="button">New fighter</button>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px 48px; align-items: end">
<div>
<label for="find" style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #6A6760; margin-bottom: 4px">FIND</label>
<input id="find" class="find" type="search" placeholder="Any part of a name" value="{{query}}" onInput="{{onFind}}">
</div>
<nav class="rail" aria-label="Jump to a letter">
<sc-for list="{{rail}}" as="r" hint-placeholder-count="26">
<sc-if value="{{r.has}}" hint-placeholder-val="{{true}}">
<a href="{{r.href}}" style="color: #111111">{{r.l}}</a>
</sc-if>
<sc-if value="{{r.none}}" hint-placeholder-val="{{false}}">
<span style="color: #CFCBC2">{{r.l}}</span>
</sc-if>
</sc-for>
</nav>
</div>

<div style="border-bottom: 3px solid #111111">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<section class="letter" id="{{g.id}}">
<h2 style="margin: 0">
<button class="lbtn" type="button" aria-expanded="{{g.expanded}}" onClick="{{g.toggle}}">
<span class="big">{{g.l}}</span>
<span style="font-size: 14px; color: #6A6760">{{g.count}} · {{g.verb}}</span>
</button>
</h2>
<sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
<div class="list">
<sc-for list="{{g.fighters}}" as="f" hint-placeholder-count="4">
<div class="f">
<a href="{{f.href}}">
<span class="ln">{{f.last}}</span>
<span style="font-size: 16px; color: #111111">{{f.first}}</span>
<span style="font-size: 14px; font-style: italic; color: #6A6760">{{f.nick}}</span>
</a>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap">{{f.record}}</span>
<span style="display: flex; gap: 0">
<button class="quiet" type="button">Edit</button>
<button class="quiet" type="button">Merge…</button>
</span>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{g.shut}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; font-size: 14px; color: #6A6760">{{g.preview}}</div>
</sc-if>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '', closed: { M: true } };
  }
  renderVals() {
    var self = this;
    // last, first, nickname, W, L, D, KOs, NC
    var all = [
      ['Antonov', 'Lev', '', 20, 2, 0, 16, 0], ['Arce', 'Teófilo', 'El Relámpago', 23, 1, 0, 16, 0],
      ['Bell', 'Marcus', '', 14, 0, 0, 12, 0], ['Brandt', 'Nikolai', 'The Wall', 29, 1, 0, 25, 0], ['Brennan', 'Kai', '', 9, 0, 0, 7, 0],
      ['Corcoran', 'Ben', '', 3, 3, 0, 0, 0],
      ['Demir', 'Mustafa', '', 12, 1, 0, 9, 0], ['Domínguez', 'Rafael', 'Rafa', 22, 2, 1, 11, 0], ['Doyle', 'Sean', '', 21, 2, 0, 13, 0],
      ['Haddad', 'Ali', '', 7, 0, 0, 5, 0], ['Hara', 'Kenji', '', 17, 1, 0, 9, 0],
      ['Kaya', 'Yusuf', '', 11, 2, 0, 8, 0], ['Kreuz', 'Dana', '', 10, 2, 2, 4, 0],
      ['Lima', 'Pedro', '', 9, 8, 1, 3, 1],
      ['Mensah-Lund', 'Kofi', '', 17, 1, 0, 12, 0], ['Mori', 'Aiko', '', 12, 0, 1, 5, 0],
      ['Okafor', 'Daniel', 'The Surgeon', 19, 1, 1, 11, 0], ['Ortega', 'Luis', '', 14, 4, 1, 9, 0]
    ];
    var q = this.state.query.trim().toLowerCase();
    var initial = function (s) { return s.charAt(0).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase(); };
    var kos = function (n) { return n === 1 ? '1 KO' : n + ' KOs'; };
    var byLetter = {};
    all.forEach(function (f) {
      var name = (f[1] + ' ' + f[2] + ' ' + f[0]).toLowerCase();
      if (q && name.indexOf(q) === -1) return;
      var l = initial(f[0]);
      (byLetter[l] = byLetter[l] || []).push({
        last: f[0], first: f[1], nick: f[2] ? '“' + f[2] + '”' : '',
        record: f[3] + '-' + f[4] + '-' + f[5] + ' (' + kos(f[6]) + ')' + (f[7] ? ', ' + f[7] + ' NC' : ''),
        href: f[0] === 'Arce' ? 'Fighter.dc.html' : '#'
      });
    });
    var letters = Object.keys(byLetter).sort();
    var groups = letters.map(function (l) {
      var open = q ? true : !self.state.closed[l];
      var fs = byLetter[l];
      return {
        l: l, id: 'letter-' + l, count: fs.length + (fs.length === 1 ? ' fighter' : ' fighters'),
        verb: open ? 'fold' : 'open', open: open, shut: !open, expanded: open ? 'true' : 'false',
        fighters: fs,
        preview: fs.map(function (f) { return f.last; }).join(', '),
        toggle: function () {
          var next = Object.assign({}, self.state.closed);
          next[l] = open;
          self.setState({ closed: next });
        }
      };
    });
    var rail = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function (l) {
      var has = !!byLetter[l];
      return { l: l, has: has, none: !has, href: '#letter-' + l };
    });
    return {
      query: this.state.query,
      onFind: function (e) { self.setState({ query: e.target.value }); },
      groups: groups, rail: rail
    };
  }
}
</script>
</body>
</html>
