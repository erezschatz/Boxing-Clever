<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Boxing Clever</title>
    <link rel="stylesheet" href="/style.css">
    <!-- lit-html is the one browser dependency, pinned here (D7, SPEC Stack);
         the bundle leaves its imports bare for this map to resolve. -->
    <script type="importmap">
    {
      "imports": {
        "lit-html": "https://esm.sh/lit-html@3.3.3",
        "lit-html/": "https://esm.sh/lit-html@3.3.3/"
      }
    }
    </script>
    <!-- app.js is front/app.ts bundled: per request in dev, once by
         `deno task build` for deployment (server/static.ts). -->
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">Boxing Clever</a>
      <nav>
        <a href="/">Events</a>
        <a href="/fighters">Fighters</a>
      </nav>
    </header>
    <main id="app"></main>
  </body>
</html>
